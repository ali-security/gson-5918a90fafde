name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Maven -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: List skipped tests with reasons
        run: |
          echo "Skipped testcases (from surefire XML reports):"
          grep -h -B1 '<skipped' */target/surefire-reports/TEST-*.xml
          echo "JUnit assumptions in the test sources that produce these skips:"
          grep -rn -B2 'assumeTrue\|assumeFalse' --include=*.java gson/src/test
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-*.jar
          if-no-files-found: error
